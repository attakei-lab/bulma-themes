<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <link rel="stylesheet" href="{{ site.base_path }}/dist/pulse/theme.full.min.css">
  <link rel="stylesheet" href="{{ site.base_path }}/assets/custom.css">
</head>

<body>
  {% getBundle "fontawesome" %}
  {% include "nav.html" %}
  <section class="hero">
    <div class="hero-body has-text-centered">
      <p class="title is-size-1">Color Themes for Bulma</p>
      <p class="subtitle">For my design, and for your design.</p>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="content">
        {{ content | safe }}
      </div>
    </div>
  </section>
  <section class="section" id="gallery">
    <div class="container">
      <h2 class="title">Themes</h2>
      <div class="columns is-multiline">
        {% for theme in collections.theme %}
        <div class="column is-one-third">
          <div class="card">
            <div class="card-image">
              <iframe src="{{ site.base_path }}/theme/{{ theme.fileSlug }}/thumb/"
                      loading="lazy"
                      style="width:100%; height:320px; border:0; pointer-events:none; display:block;"></iframe>
            </div>
            <footer class="card-footer">
              <a href="{{ site.base_path }}/theme/{{ theme.fileSlug }}/" class="card-footer-item">Preview</a>
            </footer>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
  {% include "footer.html" %}
</body>

</html>
