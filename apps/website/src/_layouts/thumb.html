<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ themePage.data.title }} — thumbnail</title>
  <link rel="stylesheet" href="{{ site.base_path }}/dist/{{ themePage.fileSlug }}/theme.min.css">
  <style>
    body { margin: 0; }
    .thumb { padding: 1rem; }
    .thumb .buttons { gap: 0.1rem; }
  </style>
</head>

<body>
  <nav class="navbar is-primary" role="navigation" aria-label="thumbnail">
    <div class="navbar-brand">
      <a class="navbar-item">
        <strong>{{ themePage.data.title }}</strong>
      </a>
    </div>
  </nav>
  <section class="hero is-light">
    <div class="hero-body has-text-centered">
      <p class="subtitle">{{ themePage.data.description }}</p>
    </div>
  </section>
  <div class="thumb">
    <div class="buttons is-centered">
      <button class="button is-small is-primary">Primary</button>
      <button class="button is-small is-info">Info</button>
      <button class="button is-small is-success">Success</button>
      <button class="button is-small is-warning">Warning</button>
      <button class="button is-small is-danger">Danger</button>
    </div>
  </div>
</body>

</html>
