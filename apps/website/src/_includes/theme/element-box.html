<div class="container mb-5">
  <h3 id="demo-element-box" class="subtitle is-4">Box</h3>
  <div class="box">
    <p>This is a <strong>box</strong> with a subtle shadow and some padding.</p>
  </div>

  <p class="heading">With media</p>
  <div class="box">
    <article class="media">
      <figure class="media-left">
        <p class="image is-64x64" style="background:#dbdbdb;border-radius:9999px;"></p>
      </figure>
      <div class="media-content">
        <div class="content">
          <p>
            <strong>Alice</strong> <small>@alice</small> <small>3 min</small>
            <br>
            Box can wrap a media object to make a comment / user-card style block.
          </p>
        </div>
        <nav class="level is-mobile">
          <div class="level-left">
            <a class="level-item" aria-label="reply">
              <span class="icon is-small"><i class="fas fa-reply"></i></span>
            </a>
            <a class="level-item" aria-label="retweet">
              <span class="icon is-small"><i class="fas fa-retweet"></i></span>
            </a>
            <a class="level-item" aria-label="like">
              <span class="icon is-small"><i class="fas fa-heart"></i></span>
            </a>
          </div>
        </nav>
      </div>
    </article>
  </div>
</div>
