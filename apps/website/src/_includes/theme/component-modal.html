<div class="container mb-5">
  <h3 id="demo-component-modal" class="subtitle is-4">Modal</h3>
  <button class="button js-modal-trigger is-primary" data-target="demo-component-modal-card">Launch modal</button>

  <div class="modal" id="demo-component-modal-card">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Modal title</p>
        <button class="delete" aria-label="close"></button>
      </header>
      <section class="modal-card-body">
        <p>The body of the modal. Place forms, text, or other content here.</p>
      </section>
      <footer class="modal-card-foot">
        <div class="buttons">
          <button class="button is-success">Save changes</button>
          <button class="button">Cancel</button>
        </div>
      </footer>
    </div>
  </div>
</div>
