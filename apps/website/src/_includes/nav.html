<nav class="navbar is-{{ headerColor or 'primary' }}" role="navigation" aria-label="main navigation">
  <div class="navbar-brand">
    <a class="navbar-item" href="{{ site.url }}{{ site.base_path }}">
      <svg viewBox="0 0 157 28" width="157" height="28" role="img" aria-label="Bulma Themes">
        <text x="0" y="21" font-family="'Zen Maru Gothic', sans-serif" font-weight="700" font-size="21" fill="#ffffff">BULMA THEMES</text>
      </svg>
    </a>

    <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </a>
  </div>

  <div id="navbarBasicExample" class="navbar-menu">
    <div class="navbar-start">
      <div class="navbar-item has-dropdown is-hoverable">
        <a class="navbar-link">Themes</a>
        <div class="navbar-dropdown nav-themes">
          <!-- Default is the project baseline: full-width above the theme grid, outside it. -->
          {% for theme in collections.theme %}
            {% if theme.data.theme == "default" %}
              <a class="navbar-item" href="{{ site.base_path }}{{ theme.url }}">{{ theme.data.title }}</a>
            {% endif %}
          {% endfor %}
          <div class="nav-theme-grid">
            {% for theme in collections.theme %}
              {% if theme.data.theme != "default" %}
                <a class="navbar-item" href="{{ site.base_path }}{{ theme.url }}">{{ theme.data.title }}</a>
              {% endif %}
            {% endfor %}
          </div>
        </div>
      </div>
      <a class="navbar-item" href="{{ site.base_path }}/docs/color-palette/">
        Docs
      </a>
    </div>

    <div class="navbar-end">
      <a class="navbar-item" href="{{ site.repo_url }}" target="_blank" >
        <span class="icon"><i class="fab fa-github"></i></span>
      </a>
    </div>
  </div>
</nav>
