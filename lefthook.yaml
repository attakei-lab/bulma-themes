---
pre-commit:
  parallel: true
  jobs:
    - name: 'Biome'
      run: 'bun run biome check --fix {staged_files}'
      glob: '*.{js,ts,jsx,tsx}'
      stage_fixed: true
    - name: 'Stylelint'
      run: 'bun run stylelint --fix {staged_files}'
      glob: '*.{css,scss,sass}'
      stage_fixed: true
    - name: 'yamllint'
      run: 'yamllint {staged_files}'
      glob: '*.{yml,yaml}'
    - name: 'actionlint'
      run: 'actionlint {staged_files}'
      glob: '.github/workflows/*.{yml,yaml}'
