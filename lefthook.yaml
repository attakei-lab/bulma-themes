---
pre-commit:
  parallel: true
  jobs:
    - name: 'Biome'
      run: 'bun run biome check --fix {staged_files}'
      glob: '*.{js,ts,jsx,tsx}'
      stage_fixed: true
    - name: 'Stylelint'
      run: 'bun run stylelint --fix {staged_files}'
      glob: '*.{css,scss,sass}'
      stage_fixed: true
    - name: 'yamllint'
      run: 'uv run yamllint {staged_files}'
      glob: '*.{yml,yaml}'
