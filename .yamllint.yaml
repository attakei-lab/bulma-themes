---
extends: default

ignore:
  # This file is edit by aqua.
  - 'aqua.yaml'
  # This path does not have user files.
  - '**/node_modules/**/*'

rules:
  # GitHub Actions requires the unquoted `on:` key; allow it without
  # tripping the YAML 1.1 boolean-alias warning.
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: true
